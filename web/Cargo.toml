[package]
name = "network-monitor-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
network-monitor-web-types = { path = "../web-types" }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Window", "Document", "Event", "EventTarget", "EventSource", "MessageEvent", "Location", "UrlSearchParams", "VisibilityState", "Performance", "PerformanceEntry", "HtmlInputElement", "HtmlSelectElement"] }
