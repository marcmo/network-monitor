<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network monitor - Quiet</title>
  <style>
    :root { color-scheme: light; --paper:#fafaf7; --ink:#25332c; --muted:#858b83; --line:#e1e5dc; --green:#5f7f65; --pale:#edf1e8; --amber:#b89960; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; -webkit-font-smoothing:antialiased; }
    button,input { font:inherit; }
    button { color:inherit; cursor:pointer; }
    button:focus-visible,input:focus-visible { outline:2px solid var(--green); outline-offset:5px; }
    button { -webkit-tap-highlight-color:transparent; }
    .app { max-width:1376px; margin:auto; padding:0 64px 110px; }
    .header { height:100px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; border-bottom:1px solid var(--line); gap:32px; }
    .brand { display:flex; align-items:center; gap:11px; font-size:15px; letter-spacing:-.5px; font-weight:650; }
    .brand-mark { width:22px; height:22px; border:1.5px solid var(--ink); border-radius:50%; display:grid; align-items:center; }
    .brand-mark::after { content:""; display:block; width:12px; height:6px; border:1.5px solid var(--ink); border-top:0; border-radius:0 0 20px 20px; transform:rotate(-30deg); margin:0 auto; }
    .nav { display:flex; align-items:center; gap:36px; height:100%; }
    .nav button { position:relative; border:0; background:none; height:100%; padding:0 3px; color:var(--muted); font-size:13px; }
    .nav button.active { color:var(--ink); font-weight:550; }
    .nav button.active::after { content:""; position:absolute; height:2px; background:var(--ink); bottom:-1px; left:0; right:0; }
    .sample { justify-self:end; color:#747c72; font-size:10px; letter-spacing:.09em; text-transform:uppercase; display:flex; gap:8px; align-items:center; }
    .sample::before { content:""; width:5px; height:5px; border:1px solid #919a8c; border-radius:50%; }
    .eyebrow { margin:0; font-size:10px; font-weight:550; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); }
    .overline { display:flex; justify-content:space-between; align-items:center; gap:18px; margin:42px 0 36px; }
    .recording-indicator { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--green); }
    .dot { width:6px; height:6px; background:var(--green); border-radius:50%; flex-shrink:0; }
    .hero { display:flex; align-items:center; justify-content:space-between; gap:40px; }
    h1,h2,h3,p { margin-top:0; }
    h1 { font-size:clamp(32px,3.5vw,48px); line-height:1.18; font-weight:400; letter-spacing:-1.9px; margin-bottom:18px; }
    .hero h1 { max-width:550px; }
    .hero p { color:#7a8479; line-height:1.7; font-size:12px; margin-bottom:0; }
    .hero-reading { display:flex; align-items:baseline; letter-spacing:-6px; font-size:110px; line-height:1; font-weight:350; text-align:right; }
    .hero-reading .unit { font-size:26px; letter-spacing:-1px; color:var(--muted); margin-left:13px; font-weight:400; }
    .reading-caption { text-align:right; font-size:11px; color:var(--muted); margin-top:14px; }
    .chart-section { margin-top:54px; }
    .section-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .section-heading h2 { font-size:12px; font-weight:500; margin:0; }
    .chart-controls { display:flex; gap:5px; align-items:center; font-size:10px; }
    .chart-controls button { background:none; border:0; color:var(--muted); padding:5px 8px; border-radius:4px; font-size:10px; }
    .chart-controls button.active { color:var(--ink); background:var(--pale); }
    .chart { width:100%; min-height:170px; }
    .chart svg { display:block; width:100%; height:auto; max-height:240px; }
    .chart-note { margin-top:10px; color:var(--muted); font-size:10px; display:flex; gap:6px; align-items:center; }
    .chart-note::before { content:""; display:block; width:13px; height:1px; background:var(--green); }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-top:32px; padding:25px 0 27px; }
    .metric { padding:0 25px; border-left:1px solid var(--line); }
    .metric:first-child { border:0; padding-left:0; }
    .metric .label { font-size:10px; color:var(--muted); margin:0 0 11px; }
    .metric .value { font-size:25px; letter-spacing:-.8px; font-weight:400; }
    .metric .unit { font-size:11px; color:var(--muted); margin-left:4px; letter-spacing:0; }
    .metric .detail { margin:8px 0 0; font-size:10px; color:var(--muted); }
    .probe-section { margin-top:37px; }
    .probe-section h2 { margin:0 0 15px; font-size:12px; font-weight:500; }
    .probe-table { width:100%; border-collapse:collapse; font-size:11px; }
    .probe-table th { font-size:9px; font-weight:400; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 0 12px; border-bottom:1px solid var(--line); }
    .probe-table td { padding:15px 0; border-bottom:1px solid #edf0e9; }
    .probe-table th:last-child,.probe-table td:last-child { text-align:right; }
    .probe-table td:nth-child(2) { color:var(--muted); font-size:10px; }
    .probe-kind { display:inline-block; width:55px; font-size:9px; letter-spacing:.05em; color:var(--muted); }
    .probe-success { color:var(--green); display:flex; gap:7px; align-items:center; font-size:10px; }
    .probe-success .dot { width:4px; height:4px; }
    .small-note { color:var(--muted); font-size:10px; line-height:1.6; margin:15px 0 0; }
    .bottom-note { margin:38px 0 0; padding-top:18px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:20px; color:var(--muted); font-size:10px; line-height:1.6; }
    .recordings-shell { display:grid; grid-template-columns:230px minmax(0,1fr); gap:42px; padding-top:38px; }
    .recordings-aside { padding-right:28px; border-right:1px solid var(--line); }
    .recordings-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:29px; }
    .recordings-heading h2 { font-size:12px; font-weight:500; margin:0; }
    .recordings-heading span { font-size:10px; color:var(--muted); }
    .session-group { margin:26px 0 12px; }
    .session-button { display:block; position:relative; width:100%; text-align:left; padding:14px 10px 14px 13px; border:0; border-radius:2px; background:transparent; margin:0 0 7px; }
    .session-button.active { background:var(--pale); }
    .session-button.active::before { content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--green); }
    .session-button:hover { background:#f0f2ec; }
    .session-name { font-size:12px; line-height:1.55; margin-bottom:9px; }
    .session-time { display:flex; justify-content:space-between; gap:8px; font-size:10px; color:var(--muted); }
    .session-time .is-recording { color:var(--green); }
    .archive-note { margin-top:42px; color:var(--muted); font-size:10px; line-height:1.6; }
    .recording-header { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:20px; }
    .recording-header .eyebrow { font-size:9px; }
    .recording-title { font-size:32px; line-height:1.2; letter-spacing:-1.2px; font-weight:400; margin-bottom:10px; }
    .recording-subtitle { font-size:11px; color:var(--muted); margin-bottom:27px; }
    .recording-metrics { display:flex; gap:36px; align-items:center; margin-bottom:30px; }
    .recording-stat .value { font-size:23px; letter-spacing:-.7px; }
    .recording-stat .value span { font-size:11px; color:var(--muted); letter-spacing:0; }
    .recording-stat .label { font-size:10px; color:var(--muted); margin-top:6px; }
    .map-wrap { position:relative; background:#eef0e7; overflow:hidden; border:1px solid #e2e7dc; }
    .map-wrap svg { display:block; width:100%; height:auto; }
    .map-controls { position:absolute; z-index:2; top:16px; left:16px; display:flex; background:rgba(250,250,247,.95); border:1px solid #dfe4d9; padding:4px; box-shadow:0 2px 5px #36433406; }
    .map-controls button { display:flex; align-items:center; gap:6px; padding:7px 9px; font-size:9px; border:0; background:transparent; color:var(--muted); }
    .map-controls button.active { color:var(--ink); background:var(--pale); }
    .map-controls button::before { content:""; width:4px; height:4px; border:1px solid currentColor; border-radius:50%; }
    .map-controls button.active::before { background:var(--green); border-color:var(--green); }
    .map-caption { margin:12px 0 0; display:flex; justify-content:space-between; gap:10px; font-size:9px; color:var(--muted); line-height:1.6; }
    .coverage { margin-top:29px; }
    .coverage .section-heading { margin-bottom:14px; }
    .coverage .section-heading span { font-size:10px; color:var(--muted); }
    .coverage-track { height:8px; width:100%; display:flex; gap:2px; overflow:hidden; }
    .coverage-track span { display:block; height:100%; background:#789577; }
    .coverage-track span.slow { background:#c0a572; }
    .coverage-track span.failed { background:#b97564; }
    .coverage-track span.missing { background:repeating-linear-gradient(90deg,#bdc3b9 0,#bdc3b9 2px,transparent 2px,transparent 5px); }
    .coverage-legend { display:flex; flex-wrap:wrap; gap:17px; margin-top:13px; color:var(--muted); font-size:9px; }
    .coverage-legend span { display:flex; align-items:center; gap:5px; }
    .legend-dot { width:5px; height:5px; background:#789577; border-radius:50%; }
    .legend-dot.slow { background:#c0a572; }
    .legend-dot.failed { background:#b97564; }
    .legend-dot.missing { background:#bcc3b7; }
    .timeline { margin-top:29px; border-top:1px solid var(--line); padding-top:22px; }
    .timeline .section-heading { margin-bottom:13px; }
    .timeline-output { font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .timeline input { width:100%; accent-color:var(--green); height:13px; margin:0; cursor:pointer; }
    .timeline-labels { display:flex; justify-content:space-between; font-size:9px; color:var(--muted); margin-top:6px; }
    .hide-coverage [data-layer="coverage"], .hide-route [data-layer="route"] { opacity:0; }
    [data-layer] { transition:opacity .2s; }
    @media (min-width:1450px) { .app { padding-left:68px; padding-right:68px; } }
    @media (max-width:950px) {
      .app { padding-left:35px; padding-right:35px; }
      .recordings-shell { grid-template-columns:180px minmax(0,1fr); gap:26px; }
      .recordings-aside { padding-right:20px; }
      .recording-metrics { gap:25px; }
      .hero-reading { font-size:90px; }
    }
    @media (max-width:680px) {
      .app { padding:0 23px 115px; }
      .header { height:117px; grid-template-columns:1fr auto; gap:0; align-content:start; padding-top:24px; }
      .brand { font-size:14px; }
      .sample { font-size:8px; }
      .nav { grid-row:2; grid-column:1/-1; height:55px; margin-top:15px; gap:28px; }
      .nav button { font-size:12px; }
      .overline { margin-top:29px; margin-bottom:31px; gap:10px; }
      .overline .eyebrow { font-size:9px; letter-spacing:.09em; }
      .recording-indicator { font-size:9px; }
      .hero { align-items:flex-start; flex-direction:column; gap:26px; }
      h1 { font-size:35px; letter-spacing:-1.35px; margin-bottom:12px; }
      .hero p { font-size:11px; }
      .hero-reading { font-size:86px; text-align:left; letter-spacing:-5px; }
      .hero-reading .unit { font-size:23px; }
      .reading-caption { text-align:left; font-size:10px; margin-top:10px; }
      .chart-section { margin-top:38px; }
      .chart { min-height:100px; }
      .chart svg { min-height:115px; }
      .metrics { grid-template-columns:1fr 1fr; row-gap:24px; padding-top:25px; margin-top:24px; }
      .metric { padding:0 0 0 24px; }
      .metric:nth-child(3) { padding-left:0; border:0; }
      .metric .value { font-size:24px; }
      .probe-table th:nth-child(2),.probe-table td:nth-child(2) { display:none; }
      .probe-kind { width:46px; }
      .probe-table td { font-size:10px; }
      .probe-table th { font-size:8px; }
      .bottom-note { flex-direction:column; gap:5px; }
      .recordings-shell { display:block; padding-top:28px; }
      .recordings-aside { border:0; padding:0 0 24px; margin-bottom:28px; border-bottom:1px solid var(--line); }
      .recordings-heading { margin-bottom:14px; }
      .session-group,.archive-note { display:none; }
      .session-list { display:flex; gap:8px; overflow-x:auto; margin-right:-23px; padding-right:23px; padding-bottom:6px; }
      .session-button { flex:0 0 175px; padding:11px 12px; background:#f1f3ed; margin:0; }
      .session-name { font-size:11px; margin-bottom:7px; }
      .session-time { font-size:9px; }
      .recording-title { font-size:29px; }
      .recording-metrics { gap:24px; flex-wrap:wrap; }
      .recording-stat .value { font-size:21px; }
      .recording-stat .label { font-size:9px; }
      .recording-header .eyebrow { font-size:8px; }
      .map-wrap { margin-left:-23px; margin-right:-23px; border-left:0; border-right:0; }
      .map-wrap svg { min-height:340px; object-fit:cover; }
      .map-caption { flex-direction:column; gap:2px; }
      .coverage-legend { gap:12px; font-size:8px; }
    }
    @media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>network monitor</div>
      <nav class="nav" aria-label="Main navigation">
        <button data-tab="live" class="active">Live</button>
        <button data-tab="recordings">Recordings</button>
      </nav>
      <div class="sample">Sample data</div>
    </header>
    <main id="content"></main>
  </div>
  <script src="shared.js"></script>
  <script>
    const records = [
      { id:'current', name:'Berlin to Leipzig', date:'Today, 09:12', duration:'1h 24m', state:'Recording', healthy:'94.2%', latency:'42', distance:'187', start:'09:12', end:'10:36', failed:'0.8%', slow:'4.1%', missing:'0.9%' },
      { id:'yesterday', name:'Berlin to Leipzig', date:'Yesterday, 16:40', duration:'1h 18m', state:'Completed', healthy:'91.8%', latency:'56', distance:'186', start:'16:40', end:'17:58', failed:'1.4%', slow:'5.9%', missing:'0.9%' },
      { id:'return', name:'Leipzig to Berlin', date:'08 Oct, 17:05', duration:'1h 31m', state:'Completed', healthy:'96.1%', latency:'34', distance:'191', start:'17:05', end:'18:36', failed:'0.5%', slow:'2.2%', missing:'1.2%' }
    ];
    let tab = new URLSearchParams(location.search).get('tab') === 'recordings' ? 'recordings' : 'live';
    let selected = 'current';
    let range = '5m';
    let coverageVisible = true;
    let routeVisible = true;
    let progress = 100;
    const content = document.getElementById('content');

    function renderLive() {
      content.innerHTML = `
        <div class="overline"><p class="eyebrow">Connection / en0 &middot; Wi-Fi</p><div class="recording-indicator"><span class="dot"></span>Recording &middot; 1h 24m</div></div>
        <section class="hero" aria-labelledby="live-title">
          <div><h1 id="live-title">The connection<br>is steady.</h1><p>All probes are responding.<br>Last sample at 10:36:24.</p></div>
          <div><div class="hero-reading">42<span class="unit">ms</span></div><div class="reading-caption">Latest TCP connection time</div></div>
        </section>
        <section class="chart-section" aria-label="Connection latency chart">
          <div class="section-heading"><h2>Connection over time</h2><div class="chart-controls" aria-label="Chart time range"><button data-range="5m" class="${range === '5m' ? 'active' : ''}" aria-pressed="${range === '5m'}">5 min</button><button data-range="30m" class="${range === '30m' ? 'active' : ''}" aria-pressed="${range === '30m'}">30 min</button></div></div>
          <div class="chart">${Mock.chart({height:195, range:range})}</div>
          <div class="chart-note">TCP connection time &middot; milliseconds</div>
        </section>
        <section class="metrics" aria-label="Connection statistics">
          <div class="metric"><p class="label">Received</p><div class="value">12.4<span class="unit">Mbit/s</span></div><p class="detail">Passive interface traffic</p></div>
          <div class="metric"><p class="label">Sent</p><div class="value">0.8<span class="unit">Mbit/s</span></div><p class="detail">Passive interface traffic</p></div>
          <div class="metric"><p class="label">95th percentile</p><div class="value">86<span class="unit">ms</span></div><p class="detail">TCP &middot; last ${range === '5m' ? '5' : '30'} minutes</p></div>
          <div class="metric"><p class="label">Failed TCP attempts</p><div class="value">${range === '5m' ? '2' : '12'}<span class="unit">/ ${range === '5m' ? '300' : '1800'}</span></div><p class="detail">Last ${range === '5m' ? '5' : '30'} minutes</p></div>
        </section>
        <section class="probe-section" aria-labelledby="probes-title"><h2 id="probes-title">A closer look</h2>
          <table class="probe-table"><thead><tr><th>Probe</th><th>Target</th><th>Status</th><th>Latest</th></tr></thead><tbody>
            <tr><td><span class="probe-kind">TCP</span>Cloudflare</td><td>1.1.1.1:443</td><td><span class="probe-success"><span class="dot"></span>Responding</span></td><td>42 ms</td></tr>
            <tr><td><span class="probe-kind">TCP</span>Google</td><td>8.8.8.8:443</td><td><span class="probe-success"><span class="dot"></span>Responding</span></td><td>38 ms</td></tr>
            <tr><td><span class="probe-kind">DNS</span>Name resolution</td><td>example.com</td><td><span class="probe-success"><span class="dot"></span>Resolved</span></td><td>18 ms</td></tr>
            <tr><td><span class="probe-kind">HTTPS</span>Web reachability</td><td>www.gstatic.com</td><td><span class="probe-success"><span class="dot"></span>204 response</span></td><td>64 ms</td></tr>
          </tbody></table>
          <p class="small-note">TCP measures connection establishment. Interface traffic reflects current use, not available bandwidth.</p>
        </section>
        <footer class="bottom-note"><span>Berlin to Leipzig &middot; current recording</span><span>Design preview &middot; illustrative data, no active connection</span></footer>`;
      content.querySelectorAll('[data-range]').forEach(button => button.addEventListener('click', () => { range = button.dataset.range; renderLive(); }));
    }

    function renderRecordings() {
      const record = records.find(item => item.id === selected);
      content.innerHTML = `
        <div class="recordings-shell">
          <aside class="recordings-aside" aria-label="Recordings">
            <div class="recordings-heading"><h2>Your recordings</h2><span>03</span></div>
            <p class="eyebrow session-group">Recent</p>
            <div class="session-list">${records.map(item => `<button class="session-button ${item.id === selected ? 'active' : ''}" data-session="${item.id}" aria-pressed="${item.id === selected}"><div class="session-name">${item.name}</div><div class="session-time"><span>${item.date.split(',')[0]}</span><span class="${item.state === 'Recording' ? 'is-recording' : ''}">${item.state === 'Recording' ? '&#9679; Recording' : item.duration}</span></div></button>`).join('')}</div>
            <p class="archive-note">A little history of<br>every connection.</p>
          </aside>
          <article class="recording-detail">
            <div class="recording-header"><p class="eyebrow">Recording / ${record.id === 'current' ? '0018' : record.id === 'yesterday' ? '0017' : '0016'}</p><div class="recording-indicator">${record.state === 'Recording' ? '<span class="dot"></span>Recording in progress' : 'Completed recording'}</div></div>
            <h1 class="recording-title">${record.name}</h1><p class="recording-subtitle">${record.date} &middot; ${record.duration} &middot; Location samples available</p>
            <div class="recording-metrics"><div class="recording-stat"><div class="value">${record.healthy}</div><div class="label">Healthy observations</div></div><div class="recording-stat"><div class="value">${record.latency}<span> ms</span></div><div class="label">Median TCP time</div></div><div class="recording-stat"><div class="value">${record.failed}</div><div class="label">Failed observations</div></div></div>
            <div class="map-wrap ${coverageVisible ? '' : 'hide-coverage'} ${routeVisible ? '' : 'hide-route'}" id="quiet-map">
              <div class="map-controls" aria-label="Map layers"><button data-layer-toggle="coverage" class="${coverageVisible ? 'active' : ''}" aria-pressed="${coverageVisible}">Coverage</button><button data-layer-toggle="route" class="${routeVisible ? 'active' : ''}" aria-pressed="${routeVisible}">Route</button></div>
              ${Mock.map({id:'map-quiet',session:selected})}
            </div>
            <div class="map-caption"><span>Observed connection quality along the recorded route.</span><span>Illustrative map &middot; sample locations</span></div>
            <section class="coverage" aria-labelledby="coverage-title"><div class="section-heading"><h2 id="coverage-title">How the connection felt</h2><span>${record.duration} of observations</span></div>
              <div class="coverage-track" role="img" aria-label="Connection quality timeline: mostly healthy, with a few slow, failed and unknown observations"><span style="width:24%"></span><span class="slow" style="width:2%"></span><span style="width:21%"></span><span class="failed" style="width:1%"></span><span style="width:9%"></span><span class="missing" style="width:2%"></span><span style="width:17%"></span><span class="slow" style="width:3%"></span><span style="width:21%"></span></div>
              <div class="coverage-legend"><span><i class="legend-dot"></i>Healthy</span><span><i class="legend-dot slow"></i>Slow</span><span><i class="legend-dot failed"></i>Failed</span><span><i class="legend-dot missing"></i>Unknown</span></div>
            </section>
            <section class="timeline" aria-labelledby="timeline-title"><div class="section-heading"><h2 id="timeline-title">Follow the journey</h2><output class="timeline-output" id="timeline-output">${record.end} &middot; latest point</output></div><input type="range" id="timeline-range" min="0" max="100" value="${progress}" aria-label="Position in recording"><div class="timeline-labels"><span>${record.start} &middot; departure</span><span>${record.end}</span></div></section>
            <p class="small-note">Coverage describes observed route quality, not carrier area coverage. Dashed sections have no recorded location.</p>
          </article>
        </div>
        <footer class="bottom-note"><span>3 recordings &middot; stored on this monitor</span><span>Design preview &middot; illustrative data, no active connection</span></footer>`;
      content.querySelectorAll('[data-session]').forEach(button => button.addEventListener('click', () => { selected = button.dataset.session; progress = 100; renderRecordings(); }));
      content.querySelectorAll('[data-layer-toggle]').forEach(button => button.addEventListener('click', () => {
        const layer = button.dataset.layerToggle;
        if (layer === 'coverage') coverageVisible = !coverageVisible;
        if (layer === 'route') routeVisible = !routeVisible;
        const visible = layer === 'coverage' ? coverageVisible : routeVisible;
        button.classList.toggle('active', visible);
        button.setAttribute('aria-pressed', String(visible));
        document.getElementById('quiet-map').classList.toggle('hide-' + layer, !visible);
      }));
      const slider = document.getElementById('timeline-range');
      const updatePosition = () => {
        progress = Number(slider.value);
        const start = record.start.split(':').map(Number);
        const end = record.end.split(':').map(Number);
        const minute = Math.round(start[0]*60+start[1]+((end[0]*60+end[1])-(start[0]*60+start[1]))*(selected === 'return' ? 1 - progress/100 : progress/100));
        document.getElementById('timeline-output').textContent = String(Math.floor(minute/60)).padStart(2,'0')+':'+String(minute%60).padStart(2,'0')+' / '+progress+'% of journey';
        if (Mock.setMapProgress) Mock.setMapProgress(document.getElementById('quiet-map'), (selected === 'return' ? 1 - progress/100 : progress/100));
      };
      slider.addEventListener('input', updatePosition);
      if (Mock.setMapProgress) Mock.setMapProgress(document.getElementById('quiet-map'), (selected === 'return' ? 1 - progress/100 : progress/100));
    }

    function setTab(next, notify = true) {
      tab = next === 'recordings' ? 'recordings' : 'live';
      document.querySelectorAll('[data-tab]').forEach(button => { button.classList.toggle('active', button.dataset.tab === tab); button.setAttribute('aria-current',button.dataset.tab === tab ? 'page' : 'false'); });
      const url = new URL(location.href); url.searchParams.set('tab', tab); history.replaceState({},'',url);
      tab === 'live' ? renderLive() : renderRecordings();
      if (notify && window.parent !== window) window.parent.postMessage({type:'prototype-tab',tab},'*');
    }
    document.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => setTab(button.dataset.tab)));
    window.addEventListener('message', event => { if (event.data && event.data.type === 'set-tab') setTab(event.data.tab, false); });
    setTab(tab, false);
  </script>
</body>
</html>
